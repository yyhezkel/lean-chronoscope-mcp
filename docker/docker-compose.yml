services:
  lean-chronoscope-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lean-chronoscope-mcp:local
    container_name: lean-chronoscope-mcp
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    # Chrome is the repeat host-OOM offender (10.7G/5.2G/4.6G kills, journal 2026-07/08). Cap it so the cgroup dies, not the host.
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 2048
    # HTTP+SSE bridge published to host loopback only. The agent runtime loads
    # HTTP MCP servers (not stdio), so this is how Claude attaches.
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - lean-chronoscope-data:/var/lib/lean-chronoscope
      - lean-chronoscope-run:/run/lean-chronoscope
      - lean-chronoscope-log:/var/log/lean-chronoscope
      # Custom fonts (optional): drop .ttf/.otf/.woff2 files in a host dir and
      # mount it here — the entrypoint runs fc-cache before Chrome starts, so
      # they become regular system fonts (proper fallback, nothing breaks).
      # The image already ships Noto (Hebrew/Arabic/CJK/emoji) out of the box.
      # - /path/on/host/fonts:/home/mcp/.fonts:ro
    # Give in-flight sessions time to checkpoint their WAL + close cleanly on
    # `docker stop` before SIGKILL. Bump if you run many concurrent sessions.
    stop_grace_period: 30s
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - LEAN_CHRONOSCOPE_DATA_DIR=/var/lib/lean-chronoscope
      - LEAN_CHRONOSCOPE_SOCKET=/run/lean-chronoscope/daemon.sock
      - LEAN_CHRONOSCOPE_LOG_DIR=/var/log/lean-chronoscope
      - LEAN_CHRONOSCOPE_LOG_LEVEL=info
      # HTTP bridge: bind all interfaces *inside* the container (the publish
      # above restricts host exposure to loopback). Bearer token required.
      # Generate a token (e.g. `openssl rand -base64 32`) and put it in .env
      # next to this file as: LEAN_CHRONOSCOPE_HTTP_TOKEN=<your-token>
      # (legacy BROWSER_MCP_HTTP_TOKEN in .env is still honored as a fallback).
      - LEAN_CHRONOSCOPE_HTTP_TOKEN=${LEAN_CHRONOSCOPE_HTTP_TOKEN:-${BROWSER_MCP_HTTP_TOKEN:?set LEAN_CHRONOSCOPE_HTTP_TOKEN in docker/.env}}
      - LEAN_CHRONOSCOPE_HTTP_HOST=0.0.0.0
      - LEAN_CHRONOSCOPE_HTTP_PORT=8780
      # Optional tool-surface mode for the HTTP bridge: "full" (default), "slim",
      # or "gateway" (3 meta-tools instead of 56 — see docs/COMPARISON.md).
      - LEAN_CHRONOSCOPE_GATEWAY=${LEAN_CHRONOSCOPE_GATEWAY:-${BROWSER_MCP_GATEWAY:-}}
      - LEAN_CHRONOSCOPE_SLIM=${LEAN_CHRONOSCOPE_SLIM:-${BROWSER_MCP_SLIM:-}}
      # Optional session-lifecycle knobs (defaults shown). Set REAPER_INTERVAL_MS=0
      # to disable the idle/size reaper entirely.
      # - LEAN_CHRONOSCOPE_REAPER_INTERVAL_MS=60000
      # - LEAN_CHRONOSCOPE_IDLE_MS=1800000
      # - LEAN_CHRONOSCOPE_SIZE_CAP_BYTES=524288000
      # - LEAN_CHRONOSCOPE_RETENTION_DAYS=7
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lean-chronoscope-data:
  lean-chronoscope-run:
  lean-chronoscope-log:
