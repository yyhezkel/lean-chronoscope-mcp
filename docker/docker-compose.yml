services:
  browser-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: browser-mcp:local
    container_name: browser-mcp
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    # HTTP+SSE bridge published to host loopback only. The agent runtime loads
    # HTTP MCP servers (not stdio), so this is how Claude attaches.
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - browser-mcp-data:/var/lib/browser-mcp
      - browser-mcp-run:/run/browser-mcp
      - browser-mcp-log:/var/log/browser-mcp
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - BROWSER_MCP_DATA_DIR=/var/lib/browser-mcp
      - BROWSER_MCP_SOCKET=/run/browser-mcp/daemon.sock
      - BROWSER_MCP_LOG_DIR=/var/log/browser-mcp
      - BROWSER_MCP_LOG_LEVEL=info
      # HTTP bridge: bind all interfaces *inside* the container (the publish
      # above restricts host exposure to loopback). Bearer token required.
      # Generate a token (e.g. `openssl rand -base64 32`) and put it in .env
      # next to this file as: BROWSER_MCP_HTTP_TOKEN=<your-token>
      - BROWSER_MCP_HTTP_TOKEN=${BROWSER_MCP_HTTP_TOKEN:?set BROWSER_MCP_HTTP_TOKEN in docker/.env}
      - BROWSER_MCP_HTTP_HOST=0.0.0.0
      - BROWSER_MCP_HTTP_PORT=8780
      # Optional tool-surface mode for the HTTP bridge: "full" (default), "slim",
      # or "gateway" (3 meta-tools instead of 56 — see docs/COMPARISON.md).
      - BROWSER_MCP_GATEWAY=${BROWSER_MCP_GATEWAY:-}
      - BROWSER_MCP_SLIM=${BROWSER_MCP_SLIM:-}
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  browser-mcp-data:
  browser-mcp-run:
  browser-mcp-log:
