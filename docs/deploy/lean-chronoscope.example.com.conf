# Reference nginx vhost: https://lean-chronoscope.example.com -> HTTP+SSE bridge (127.0.0.1:8780)
#
# Replace `lean-chronoscope.example.com` with your own hostname and adjust cert
# paths to match your TLS setup. The proxy block below is the part that
# matters for MCP Streamable HTTP / SSE.
#
# Prereqs (must exist before nginx -t passes):
#   1. DNS: lean-chronoscope.example.com  A  <your-server-ip>
#   2. Cert at the paths referenced below (Let's Encrypt / certbot recommended).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lean-chronoscope.example.com;

    ssl_certificate     /etc/letsencrypt/live/lean-chronoscope.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lean-chronoscope.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    # MCP Streamable HTTP / SSE: must use HTTP/1.1, must NOT buffer, must keep
    # the stream open, and must pass the bearer token through to the bridge.
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;  # bearer token passthrough
        proxy_buffering off;            # critical for SSE — no response buffering
        proxy_cache off;
        proxy_read_timeout 3600s;       # long-lived event stream
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/lean-chronoscope.access.log;
    error_log  /var/log/nginx/lean-chronoscope.error.log;
}

# Port 80 -> Let's Encrypt HTTP-01 challenge + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name lean-chronoscope.example.com;
    location /.well-known/ { root /var/www/letsencrypt; allow all; }
    location / { return 301 https://$host$request_uri; }
}
